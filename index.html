<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>課堂互動測驗</title>
  <style>
    :root {
      --primary: #2e8b57;
      --primary-light: #e8f5e9;
      --primary-dark: #1e603b;
      --bg: #f4f7f5;
      --card: #ffffff;
      --text: #2c3e50;
      --muted: #6c757d;
      --danger: #d9534f;
      --border: #dce4de;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0; padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans TC", sans-serif;
      background-color: var(--bg); color: var(--text);
      line-height: 1.6;
    }
    .container {
      max-width: 720px; margin: 0 auto;
      background: var(--card); border-radius: 16px;
      padding: 24px; box-shadow: 0 4px 16px rgba(0,0,0,0.06);
    }
    h1, h2 { margin-top: 0; color: var(--primary-dark); text-align: center; }
    .hidden { display: none !important; }

    /* 表單與按鈕 */
    .form-group { margin-bottom: 18px; }
    label { display: block; font-weight: 700; margin-bottom: 6px; font-size: 1.05rem; }
    select, input[type="text"] {
      width: 100%; padding: 14px; font-size: 1.1rem;
      border: 2px solid var(--border); border-radius: 10px;
      background: #fff; color: var(--text);
    }
    select:focus, input:focus { outline: none; border-color: var(--primary); }
    .btn {
      display: block; width: 100%; padding: 16px;
      font-size: 1.15rem; font-weight: 700; text-align: center;
      border: none; border-radius: 12px; cursor: pointer;
      background: var(--primary); color: #fff; transition: 0.2s;
    }
    .btn:active { transform: scale(0.98); }
    .btn:disabled { background: #a5c4b1; cursor: not-allowed; }
    .btn-outline {
      background: #fff; color: var(--primary);
      border: 2px solid var(--primary); margin-top: 12px;
    }

    /* 測驗介面 */
    .progress-bar {
      height: 10px; background: var(--primary-light);
      border-radius: 5px; overflow: hidden; margin-bottom: 20px;
    }
    .progress-fill {
      height: 100%; background: var(--primary);
      width: 0%; transition: width 0.3s;
    }
    .q-meta {
      display: flex; justify-content: space-between;
      font-size: 0.95rem; color: var(--muted); margin-bottom: 10px;
    }
    .q-text {
      font-size: 1.25rem; font-weight: 700;
      margin-bottom: 20px; white-space: pre-wrap;
    }
    .option-btn {
      display: block; width: 100%; text-align: left;
      padding: 16px 18px; margin-bottom: 12px;
      font-size: 1.1rem; background: #fff; color: var(--text);
      border: 2px solid var(--border); border-radius: 12px;
      cursor: pointer; transition: 0.15s;
    }
    .option-btn.selected {
      background: var(--primary-light);
      border-color: var(--primary);
      color: var(--primary-dark); font-weight: 700;
    }
    .nav-row {
      display: flex; gap: 12px; margin-top: 24px;
    }
    .nav-row .btn { flex: 1; margin-top: 0; }

    /* 結果頁 */
    .score-box {
      text-align: center; padding: 24px;
      background: var(--primary-light); border-radius: 14px;
      margin-bottom: 24px;
    }
    .score-num { font-size: 3.5rem; font-weight: 800; color: var(--primary-dark); }
    .review-item {
      border: 1px solid var(--border); border-radius: 12px;
      padding: 16px; margin-bottom: 14px;
    }
    .review-item.wrong { border-left: 6px solid var(--danger); background: #fff9f9; }
    .review-item.correct { border-left: 6px solid var(--primary); }
    .badge {
      display: inline-block; padding: 2px 8px; border-radius: 6px;
      font-size: 0.85rem; font-weight: 700; margin-bottom: 6px;
    }
    .badge-wrong { background: #fdecea; color: var(--danger); }
    .badge-correct { background: var(--primary-light); color: var(--primary-dark); }
    .loading { text-align: center; padding: 40px 0; font-size: 1.15rem; color: var(--muted); }
  </style>
</head>
<body>

<div class="container">
  <!-- 1. 登入／基本資料頁 -->
  <div id="screen-start">
    <h1 id="quiz-title">課堂互動測驗</h1>
    
    <div class="form-group" id="unit-input-group">
      <label for="input-unit">測驗代碼（請看黑板輸入，例如：4-1）</label>
      <input type="text" id="input-unit" placeholder="輸入單元代碼...">
    </div>

    <div class="form-group">
      <label for="select-class">選擇班級</label>
      <select id="select-class"></select>
    </div>

    <div class="form-group">
      <label for="select-seat">選擇座號</label>
      <select id="select-seat"></select>
    </div>

    <button class="btn" id="btn-start">開始測驗</button>
  </div>

  <!-- 2. 載入中 -->
  <div id="screen-loading" class="loading hidden">
    正在從題庫載入題目，請稍候...
  </div>

  <!-- 3. 作答頁 -->
  <div id="screen-quiz" class="hidden">
    <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
    <div class="q-meta">
      <span id="q-counter">第 1 / 10 題</span>
      <span id="student-info"></span>
    </div>
    <div class="q-text" id="q-text"></div>
    <div id="options-container"></div>
    <div class="nav-row">
      <button class="btn btn-outline" id="btn-prev">上一題</button>
      <button class="btn" id="btn-next">下一題</button>
      <button class="btn hidden" id="btn-submit">確認交卷</button>
    </div>
  </div>

  <!-- 4. 結果與解析頁 -->
  <div id="screen-result" class="hidden">
    <h2>測驗完成！</h2>
    <div class="score-box">
      <div>本次得分</div>
      <div class="score-num" id="result-score">0</div>
      <div id="result-summary"></div>
      <div id="sync-status" style="margin-top:8px; font-size:0.9rem; color:var(--muted);"></div>
    </div>
    <div id="review-list"></div>
  </div>
</div>

<script>
  // ==========================================
  // 系統設定區（之後要改班級或座號改這裡就好）
  // ==========================================
  const CONFIG = {
    API_URL: 'https://script.google.com/macros/s/AKfycbwS6mz-OH4zKKVxDuMVxV0He8F4r0A8TMnBPU_srmhi_O0qAEK_25ewyBH5ZG8qdl3w/exec',
    CLASSES: {
      '601': 23,
      '602': 22,
      '603': 23,
      '301': 25,
      '302': 24,
      '303': 23
    }
  };

  // 系統狀態
  let state = {
    quizCode: '',
    className: '',
    seatNumber: '',
    questions: [],
    answers: {}, // { questionId: 'A' }
    currentIndex: 0
  };

  // 解析網址參數 (?unit=4-1 或 ?ids=6-4-1-01,6-4-1-02)
  const urlParams = new URLSearchParams(window.location.search);
  const paramUnit = urlParams.get('unit') || '';
  const paramIds = urlParams.get('ids') || '';
  const STORAGE_KEY = `quiz_save_${paramUnit || paramIds || 'manual'}`;

    // 初始化介面
    function init() {
      const classSel = document.getElementById('select-class');
      const seatSel = document.getElementById('select-seat');
  
      // 1. 產生班級選單
      classSel.innerHTML = '<option value="">-- 請選擇班級 --</option>' +
        Object.keys(CONFIG.CLASSES).map(c => `<option value="${c}">${c} 班</option>`).join('');
  
      // 2. 預設座號選單（還沒選班級前）
      seatSel.innerHTML = '<option value="">-- 請先選擇班級 --</option>';
  
      // 3. 選完班級後，自動連動該班人數
      classSel.addEventListener('change', () => {
        const maxSeat = CONFIG.CLASSES[classSel.value] || 0;
        let seatHtml = '<option value="">-- 請選擇座號 --</option>';
        for (let i = 1; i <= maxSeat; i++) {
          seatHtml += `<option value="${i}">${i} 號</option>`;
        }
        seatSel.innerHTML = seatHtml;
      });

    // 如果網址已經鎖定單元或題號，隱藏手動輸入框
    if (paramUnit || paramIds) {
      document.getElementById('unit-input-group').classList.add('hidden');
      document.getElementById('quiz-title').textContent = paramUnit ? `單元 ${paramUnit} 測驗` : '專屬加強測驗';
    }

    // 檢查是否有未完成的暫存進度（防重整）
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) {
      try {
        const parsed = JSON.parse(saved);
        if (parsed.questions && parsed.questions.length > 0) {
          state = parsed;
          showScreen('screen-quiz');
          renderQuestion();
          return;
        }
      } catch (e) { localStorage.removeItem(STORAGE_KEY); }
    }
  }

  function showScreen(id) {
    ['screen-start', 'screen-loading', 'screen-quiz', 'screen-result'].forEach(s => {
      document.getElementById(s).classList.toggle('hidden', s !== id);
    });
  }

  // 洗牌演算法（打亂選項防偷看）
  function shuffle(arr) {
    const copy = [...arr];
    for (let i = copy.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [copy[i], copy[j]] = [copy[j], copy[i]];
    }
    return copy;
  }

  // 開始測驗：向 Google Apps Script 撈題目
  document.getElementById('btn-start').addEventListener('click', async () => {
    const className = document.getElementById('select-class').value;
    const seatNumber = document.getElementById('select-seat').value;
    const manualUnit = document.getElementById('input-unit').value.trim();
    const targetUnit = paramUnit || manualUnit;

    if (!paramIds && !targetUnit) return alert('請先輸入測驗代碼喔！');
    if (!className || !seatNumber) return alert('請先選擇你的班級和座號！');

    state.className = className;
    state.seatNumber = seatNumber;
    state.quizCode = paramIds ? '專屬補救卷' : targetUnit;

    showScreen('screen-loading');

    try {
      const query = paramIds
        ? `action=getQuestions&ids=${encodeURIComponent(paramIds)}`
        : `action=getQuestions&unit=${encodeURIComponent(targetUnit)}`;
      
      const res = await fetch(`${CONFIG.API_URL}?${query}`);
      const json = await res.json();

      if (json.status !== 'success' || !json.data || json.data.length === 0) {
        alert('找不到題目！請確認測驗代碼是否正確，或題庫狀態已改為「已審核」。');
        showScreen('screen-start');
        return;
      }

      // 將每題選項打亂
      state.questions = json.data.map(q => ({
        ...q,
        shuffledOptions: shuffle(q.options)
      }));
      state.answers = {};
      state.currentIndex = 0;

      saveProgress();
      showScreen('screen-quiz');
      renderQuestion();
    } catch (err) {
      alert('連線失敗，請檢查網路連線後再試一次。');
      showScreen('screen-start');
    }
  });

  function saveProgress() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  }

  // 渲染當前題目
  function renderQuestion() {
    const q = state.questions[state.currentIndex];
    const total = state.questions.length;

    document.getElementById('progress-fill').style.width = `${((state.currentIndex + 1) / total) * 100}%`;
    document.getElementById('q-counter').textContent = `第 ${state.currentIndex + 1} / ${total} 題`;
    document.getElementById('student-info').textContent = `${state.className}班 ${state.seatNumber}號`;
    document.getElementById('q-text').textContent = q.question;

    const container = document.getElementById('options-container');
    container.innerHTML = '';

    q.shuffledOptions.forEach(opt => {
      if (!opt.text) return;
      const btn = document.createElement('button');
      btn.className = 'option-btn' + (state.answers[q.id] === opt.key ? ' selected' : '');
      btn.textContent = opt.text;
      btn.onclick = () => {
        state.answers[q.id] = opt.key;
        saveProgress();
        renderQuestion();
      };
      container.appendChild(btn);
    });

    document.getElementById('btn-prev').disabled = state.currentIndex === 0;
    const isLast = state.currentIndex === total - 1;
    document.getElementById('btn-next').classList.toggle('hidden', isLast);
    document.getElementById('btn-submit').classList.toggle('hidden', !isLast);
  }

  document.getElementById('btn-prev').onclick = () => {
    if (state.currentIndex > 0) { state.currentIndex--; renderQuestion(); }
  };
  document.getElementById('btn-next').onclick = () => {
    if (state.currentIndex < state.questions.length - 1) { state.currentIndex++; renderQuestion(); }
  };

  // 交卷與計分
  document.getElementById('btn-submit').onclick = async () => {
    const unanswered = state.questions.filter(q => !state.answers[q.id]).length;
    if (unanswered > 0) {
      if (!confirm(`還有 ${unanswered} 題還沒作答，確定要直接交卷嗎？`)) return;
    } else {
      if (!confirm('確定要交卷了嗎？交卷後就不能修改囉！')) return;
    }

    const submitBtn = document.getElementById('btn-submit');
    submitBtn.disabled = true;
    submitBtn.textContent = '正在送出成績...';

    let correctCount = 0;
    const wrongTags = [];
    const details = [];

    state.questions.forEach(q => {
      const userAns = state.answers[q.id] || '';
      const isCorrect = userAns === q.answer;
      if (isCorrect) {
        correctCount++;
      } else if (q.tag) {
        wrongTags.push(q.tag);
      }
      details.push({ id: q.id, userAns, correctAns: q.answer, isCorrect });
    });

    const totalCount = state.questions.length;
    const score = Math.round((correctCount / totalCount) * 100);

    // 清除暫存並顯示結果頁
    localStorage.removeItem(STORAGE_KEY);
    renderResult(score, correctCount, totalCount);
    showScreen('screen-result');

    // 背景傳送成績回 Google Sheets
    const statusEl = document.getElementById('sync-status');
    statusEl.textContent = '正在將成績傳送給老師...';

    try {
      await fetch(CONFIG.API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({
          action: 'submitQuiz',
          quizCode: state.quizCode,
          className: state.className,
          seatNumber: state.seatNumber,
          score,
          correctCount,
          totalCount,
          wrongTags,
          details
        })
      });
      statusEl.textContent = '✅ 成績已成功登錄！';
      statusEl.style.color = 'var(--primary-dark)';
    } catch (err) {
      statusEl.textContent = '⚠️ 成績上傳異常，請舉手請老師確認這個畫面！';
      statusEl.style.color = 'var(--danger)';
    }
  };

  function renderResult(score, correctCount, totalCount) {
    document.getElementById('result-score').textContent = score;
    document.getElementById('result-summary').textContent = `答對 ${correctCount} / ${totalCount} 題`;

    const list = document.getElementById('review-list');
    list.innerHTML = state.questions.map((q, idx) => {
      const userAnsKey = state.answers[q.id] || '';
      const isCorrect = userAnsKey === q.answer;
      const userOpt = q.options.find(o => o.key === userAnsKey);
      const correctOpt = q.options.find(o => o.key === q.answer);

      return `
        <div class="review-item ${isCorrect ? 'correct' : 'wrong'}">
          <span class="badge ${isCorrect ? 'badge-correct' : 'badge-wrong'}">
            第 ${idx + 1} 題：${isCorrect ? '答對' : '答錯'}
          </span>
          <div style="font-weight:700; margin-bottom:6px;">${q.question}</div>
          <div>你的答案：${userOpt ? userOpt.text : '（未作答）'}</div>
          ${!isCorrect ? `<div style="color:var(--primary-dark); font-weight:700;">正確答案：${correctOpt ? correctOpt.text : q.answer}</div>` : ''}
          ${q.explanation ? `<div style="margin-top:6px; font-size:0.95rem; color:var(--muted);">💡 解析：${q.explanation}</div>` : ''}
        </div>
      `;
    }).join('');
  }

  init();
</script>
</body>
</html>
